<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Extract a faculty member's personal class routine from a departmental routine (PDF or DOCX) and export it as PDF or DOCX."
    />
    <title>Faculty Routine Extractor</title>
    <script>
      // Apply persisted theme before first paint to avoid a flash.
      try {
        const t = JSON.parse(localStorage.getItem('fre:theme') || 'null')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
